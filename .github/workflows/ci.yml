name: SemanticDoc CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-pytest:
    name: PyTorch & FastAPI RAG Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU PyTorch & backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Generate sample PDF & run Pytest suite
        working-directory: ./backend
        run: |
          python playground/03_create_sample_pdf.py
          PYTHONPATH=. pytest -v